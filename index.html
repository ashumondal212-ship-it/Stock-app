<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Stock Live</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211d;--mute:#66736e;--line:#e2e8e5;--brand:#1f6f5c;--ok:#1b7a43;--okbg:#e2f4e8;--warn:#9a6200;--warnbg:#fff1d6;--bad:#b3261e;--badbg:#fde6e4;--up:#b7ecc6;--down:#f8c4bf}
@media(prefers-color-scheme:dark){:root{--bg:#101615;--card:#18201e;--ink:#eaf1ee;--mute:#93a29c;--line:#28332f;--brand:#3fb28f;--ok:#6fd39a;--okbg:#173a27;--warn:#f0b955;--warnbg:#3d2f10;--bad:#ff8f86;--badbg:#421b18;--up:#245b3a;--down:#6b2a25}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top,0) 0 calc(64px + env(safe-area-inset-bottom,0))}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px;margin:0}
.st{font-size:12px;opacity:.9;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#7CFFB0}
.dot.off{background:#ff8f86}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:8px 10px;font-size:14px}
main{padding:12px;max-width:640px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:19px;margin-top:2px}
.kpi span{font-size:12px;color:var(--mute)}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
input[type=search],select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
input[type=search]{grid-column:1/-1}
label.chk{display:flex;align-items:center;gap:8px;font-size:15px;margin:4px 2px 12px}
label.chk input{width:20px;height:20px}
h2{font-size:14px;color:var(--mute);margin:16px 2px 8px;font-weight:600}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row.tap{cursor:pointer}
.row.sel{outline:2px solid var(--brand)}
.nm{font-weight:600;font-size:15px;line-height:1.25}
.sub{font-size:13px;color:var(--mute);margin-top:3px}
.val{text-align:right;white-space:nowrap}
.val b{font-size:18px;display:inline-block;padding:0 4px;border-radius:5px}
.val small{display:block;font-size:12px;color:var(--mute)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-top:5px;font-weight:600}
.g{background:var(--okbg);color:var(--ok)}.a{background:var(--warnbg);color:var(--warn)}.r{background:var(--badbg);color:var(--bad)}
.plan{font-size:13px;margin-top:7px;line-height:1.45}
.row.short{border-left:4px solid var(--bad)}
.up{animation:fu 2.5s ease-out}.down{animation:fd 2.5s ease-out}
@keyframes fu{0%,30%{background:var(--up)}100%{background:transparent}}
@keyframes fd{0%,30%{background:var(--down)}100%{background:transparent}}
.msg{text-align:center;color:var(--mute);padding:24px 8px}
.err{background:var(--badbg);color:var(--bad);padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{background:none;border:0;padding:14px 4px;font-size:16px;font-weight:600;color:var(--mute)}
nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
@media(prefers-reduced-motion:reduce){.up,.down{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Stock Live</h1>
  <div class="st"><span class="dot" id="dot"></span><span id="upd">Loading…</span></div>
  <button id="ref" type="button">Refresh</button>
</header>
<main>
  <div id="err"></div>
  <div class="kpis" id="kpis"></div>
  <div class="ctl">
    <input type="search" id="q" placeholder="Search product or SKU code">
    <select id="pl"></select>
    <select id="sort"><option value="n">Sort: Name</option><option value="v">Sort: Lowest first</option></select>
  </div>
  <label class="chk"><input type="checkbox" id="sh"> Show shortages only</label>
  <div id="view"></div>
</main>
<nav>
  <button data-t="box" class="on" type="button">Box</button>
  <button data-t="lam" type="button">Laminate</button>
  <button data-t="fg" type="button">FG</button>
</nav>
<script>
// ====== SETTINGS ======
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vScQPrL8JKY7fKJzt-8h9eC7GwaSvfp_O2EKlC0DEv4FwBJj7gaEjYd0aMPye9fgb8hFMM44SRGD_kn/pub?output=csv";
const REFRESH_SECONDS = 15;
// =======================

const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isNaN(n) ? 0 : n; };
const fmt = (n, d = 0) => n.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const keyOf = (a, b) => [String(a).trim(), String(b).trim()].sort().join("|");

let tab = "box", plant = "All", data = null, prev = {};

function parseCSV(t) {
  const rows = []; let r = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { r.push(f); f = ""; }
    else if (c === "\n") { r.push(f); rows.push(r); r = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || r.length) { r.push(f); rows.push(r); }
  return rows.map(x => x.map(v => v.trim()));
}

function build(rows) {
  const plants = [], skus = []; let tot = null, mode = "";
  for (const r of rows) {
    if (r[1] === "Location") { mode = "p"; continue; }
    if (r[4] === "SKU Code") { mode = "s"; continue; }
    if ((r[1] || "").startsWith("TOTAL / ALL")) { mode = ""; continue; }
    if ((r[1] || "").startsWith("GRAND TOTAL")) { tot = r; mode = ""; continue; }
    if (mode === "p" && r[2]) plants.push({ loc: r[1], name: r[2], key: keyOf(r[1], r[2]), a: num(r[4]), c: num(r[5]), r: num(r[6]), cs: r[7], la: num(r[8]), lc: num(r[9]), lr: num(r[10]), ls: r[11] });
    if (mode === "s" && r[5]) skus.push({ pl: r[1], loc: r[2], key: keyOf(r[1], r[2]), code: r[4], name: r[5], a: num(r[6]), c: num(r[7]), r: num(r[8]), cs: r[9], la: num(r[10]), lc: num(r[11]), lr: num(r[12]), ls: r[13], cap: num(r[14]), tons: num(r[15]) });
  }
  if (!tot) throw new Error("Sheet layout not recognised");
  for (const p of plants) {
    const s = skus.filter(x => x.key === p.key);
    p.cap = s.reduce((a, x) => a + x.cap, 0); p.tons = s.reduce((a, x) => a + x.tons, 0);
  }
  return { plants, skus, t: { a: num(tot[6]), c: num(tot[7]), r: num(tot[8]), la: num(tot[10]), lc: num(tot[11]), lr: num(tot[12]), cap: num(tot[14]), tons: num(tot[15]) } };
}

const boxShort = s => /^(shortage|deficit)/i.test(s.cs) || s.r < 0;
const lamShort = s => /^shortage/i.test(s.ls);
const cls = t => /shortage|deficit|low|critical|no stock/i.test(t) ? "r" : /attention/i.test(t) ? "a" : "g";
const V = (k, v, d = 0, u = "") => `<b data-k="${esc(k)}" data-v="${v}">${fmt(v, d)}${u}</b>`;

function fgKpi() {
  let pc = 0, made = 0, left = 0;
  data.skus.forEach(s => { const p = planOf(s); if (p) { pc += p.cs; made += s.c; left += p.left; } });
  return [["Plan (cases)", pc, "pc"], ["Made so far", made, "pm"], ["Still to make", left, "pl"]];
}

function kpis() {
  const t = data.t;
  const set = tab === "box" ? [["Total boxes", t.a, "a"], ["Used", t.c, "c"], ["Remaining", t.r, "r"]]
    : tab === "lam" ? [["Total kg", t.la, "la", 0], ["Used kg", t.lc, "lc", 0], ["Remaining kg", t.lr, "lr", 0]]
    : fgKpi();
  $("#kpis").innerHTML = set.map(x => `<div class="kpi"><span>${x[0]}</span>${V(tab + "|K|" + x[2], x[1], x[3] || 0)}</div>`).join("");
}

function plantRow(p) {
  let main, sub, badge = "";
  if (tab === "box") { main = V("box|P|" + p.key + "|r", p.r, 0); sub = `Total ${fmt(p.a)} · Used ${fmt(p.c)}`; badge = p.cs; }
  else if (tab === "lam") { main = V("lam|P|" + p.key + "|r", p.lr, 1, " kg"); sub = `Total ${fmt(p.la, 1)} · Used ${fmt(p.lc, 1)}`; badge = p.ls; }
  else { main = V("fg|P|" + p.key + "|cap", p.cap, 0); let pc = 0, made = 0, left = 0;
    data.skus.filter(s => s.key === p.key).forEach(s => { const q = planOf(s); if (q) { pc += q.cs; made += s.c; left += q.left; } });
    sub = pc ? `Plan ${fmt(pc)} cs · Made ${fmt(made)} · Left ${fmt(left)}` : `Produced ${fmt(p.c)} · no plan`; }
  return `<div class="row tap ${plant === p.key ? "sel" : ""}" data-p="${esc(p.key)}"><div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.loc)}</div>${badge ? `<span class="badge ${cls(badge)}">${esc(badge)}</span>` : ""}</div><div class="val">${main}<small>${sub}</small></div></div>`;
}

function skuRow(s) {
  const id = s.key + "|" + s.code + "|" + s.name;
  let main, sub, badge = "", short = false;
  if (tab === "box") { main = V("box|S|" + id + "|r", s.r, 0); sub = `Total ${fmt(s.a)} · Used ${fmt(s.c)}`; badge = s.cs; short = boxShort(s); }
  else if (tab === "lam") { main = V("lam|S|" + id + "|r", s.lr, 1, " kg"); sub = `Total ${fmt(s.la, 1)} · Used ${fmt(s.lc, 1)}`; badge = s.ls; short = lamShort(s); }
  else { main = V("fg|S|" + id + "|cap", s.cap, 0); sub = `Produced ${fmt(s.c)} · ${fmt(s.tons, 1)} tons possible`; short = boxShort(s) || lamShort(s); }
  const pi = planOf(s); let plan = "";
  if (pi) {
    const ps = planShort(s); short = short || ps;
    const cover = tab === "box" ? `Boxes in stock ${fmt(s.r)}` : tab === "lam" ? `Laminate covers ${fmt(s.cap)} cs` : `Boxes ${fmt(s.r)} · Laminate covers ${fmt(s.cap)} cs`;
    const tag = !pi.left ? ["g", "Plan done"] : ps ? ["r", "Short for plan"] : ["g", "Plan covered"];
    plan = `<div class="plan">${PLAN_LABEL}: ${fmt(pi.cs)} cs (${fmt(pi.t, 1)} t) · Made ${fmt(s.c)} · Left ${fmt(pi.left)} cs${pi.left ? `<br>${cover}` : ""}<br><span class="badge ${tag[0]}">${tag[1]}</span></div>`;
  }
  return `<div class="row ${short ? "short" : ""}"><div><div class="nm">${esc(s.name)}</div><div class="sub">${esc(s.code)} · ${esc(s.pl)}</div>${badge ? `<span class="badge ${cls(badge)}">${esc(badge)}</span>` : ""}${plan}</div><div class="val">${main}<small>${sub}</small></div></div>`;
}

function render() {
  if (!data) return;
  kpis();
  const q = $("#q").value.trim().toLowerCase(), sh = $("#sh").checked, sort = $("#sort").value;
  const pl = $("#pl");
  if (pl.options.length !== data.plants.length + 1) {
    pl.innerHTML = `<option value="All">All plants</option>` + data.plants.map(p => `<option value="${esc(p.key)}">${esc(p.name)} – ${esc(p.loc)}</option>`).join("");
  }
  pl.value = plant;
  const used = x => planOf(x) || (tab === "box" ? (x.a || x.c || x.r || boxShort(x)) : tab === "lam" ? (x.la || x.lc || x.lr || lamShort(x)) : (x.cap || x.c || boxShort(x) || lamShort(x)));
  let items = data.skus.filter(s => used(s) && (plant === "All" || s.key === plant));
  if (q) items = items.filter(s => (s.name + " " + s.code).toLowerCase().includes(q));
  if (sh) items = items.filter(s => (tab === "lam" ? lamShort(s) : tab === "box" ? boxShort(s) : (boxShort(s) || lamShort(s))) || planShort(s));
  const sv = s => tab === "box" ? s.r : tab === "lam" ? s.lr : s.cap;
  items.sort(sort === "v" ? (a, b) => sv(a) - sv(b) : (a, b) => a.name.localeCompare(b.name));
  $("#view").innerHTML = `<h2>Plants (tap to filter)</h2>` + data.plants.map(plantRow).join("") +
    `<h2>Products (${items.length})</h2>` + (items.length ? items.map(skuRow).join("") : `<div class="msg">No products match. Clear the search or filters.</div>`);
  flash();
}

function flash() {
  document.querySelectorAll("[data-k]").forEach(el => {
    const k = el.dataset.k, v = el.dataset.v;
    if (k in prev && prev[k] !== v) el.classList.add(num(v) > num(prev[k]) ? "up" : "down");
    prev[k] = v;
  });
}

const planOf = s => { const p = (PLAN[s.key] || {})[s.code]; return p ? { t: p[0], cs: p[1], left: Math.max(p[1] - s.c, 0) } : null; };
const planShort = s => { const p = planOf(s); if (!p || !p.left) return false; return tab === "box" ? p.left > s.r : tab === "lam" ? p.left > s.cap : (p.left > s.r || p.left > s.cap); };

function fromSnap() {
  const plants = SNAP.P.map(x => ({ loc: x[0], name: x[1], key: keyOf(x[0], x[1]), a: x[2], c: x[3], r: x[4], cs: x[5], la: x[6], lc: x[7], lr: x[8], ls: x[9] }));
  const skus = [];
  for (const k in SNAP.S) {
    const [pl, loc] = k.split("|");
    SNAP.S[k].forEach(x => skus.push({ pl, loc, key: keyOf(pl, loc), code: x[0], name: x[1], a: x[2], c: x[3], r: x[4], cs: x[5], la: x[6], lc: x[7], lr: x[8], ls: x[9], cap: x[10], tons: x[11] }));
  }
  for (const p of plants) {
    const s = skus.filter(x => x.key === p.key);
    p.cap = s.reduce((a, x) => a + x.cap, 0); p.tons = s.reduce((a, x) => a + x.tons, 0);
  }
  return { plants, skus, t: SNAP.t, snap: true };
}

async function load() {
  try {
    const res = await fetch(CSV_URL + "&t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = build(parseCSV(await res.text()));
    $("#err").innerHTML = ""; $("#dot").classList.remove("off");
    $("#upd").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    render();
  } catch (e) {
    $("#dot").classList.add("off");
    if (!data) { data = fromSnap(); render(); }
    if (data.snap) {
      $("#upd").textContent = "Saved copy";
      $("#err").innerHTML = `<div class="err">Showing saved data from ${SNAP_DATE}, not live. Live data could not load (${esc(e.message)}). Retrying automatically.</div>`;
    } else {
      $("#upd").textContent = "Offline";
      $("#err").innerHTML = `<div class="err">Could not refresh (${esc(e.message)}). Showing the last data received. Retrying automatically.</div>`;
    }
  }
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
